<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wolfflix Homework - LOTR: The Ring of Power</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@400;600;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0a0a;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .font-epic { font-family: 'Cinzel', serif; }

        /* Animations */
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0;} 100% { transform: scale(1); opacity: 1;} }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .animate-slideIn { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop { animation: pop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-shake { animation: shake 0.4s ease-in-out forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Hide scrollbar for mobile feel */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-white flex justify-center items-center min-h-[100dvh]">

    <div id="root" class="w-full h-full max-w-md bg-[#111] relative overflow-hidden sm:h-[850px] sm:rounded-[40px] sm:border-8 sm:border-[#222] sm:shadow-2xl flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONSTANTS ---
        const YOUTUBE_ID = "N4xV2RIlMi4";
        const BG_COVER = "https://images.unsplash.com/photo-1533038590840-1cbea6d649ab?q=80&w=1000&auto=format&fit=crop";

        // --- COMPONENTS ---
        const Icon = ({ name, size = 20, className = "" }) => (
            <i className={`fa-solid fa-${name} ${className}`} style={{ fontSize: size }}></i>
        );

        // --- DATA: 15 EXERCISES (B2 LEVEL) ---
        const QUESTIONS = [
            {
                id: 1,
                type: "vocab",
                question: "What does the verb 'DECEIVE' mean?",
                options: [
                    "To tell someone a powerful truth.",
                    "To create something using magic.",
                    "To deliberately cause someone to believe something that is not true.",
                    "To destroy an object."
                ],
                correct: 2,
                explanation: "To deceive means to trick or lie to someone. In the movie, Sauron deceived the elves and men."
            },
            {
                id: 2,
                type: "grammar",
                question: "Which of these sentences is in the PASSIVE VOICE?",
                options: [
                    "Sauron forged the master ring.",
                    "The dark lord poured his cruelty into the ring.",
                    "Another ring was made in the fires of Mount Doom.",
                    "Men desire power above all else."
                ],
                correct: 2,
                explanation: "The passive voice focuses on the object receiving the action ('Another ring') and uses 'was + past participle' (was made)."
            },
            {
                id: 3,
                type: "vocab",
                question: "To 'forge' a weapon or a ring means to...",
                options: [
                    "Hide it in a secret place.",
                    "Make or shape it by heating it in a fire and hammering it.",
                    "Buy it from a merchant.",
                    "Find it by accident."
                ],
                correct: 1,
                explanation: "Forging involves shaping metal using fire and heat. It can also mean to build a strong relationship."
            },
            {
                id: 4,
                type: "grammar",
                question: "Complete the passive sentence: 'Three rings ________ to the elves.'",
                options: [
                    "were give",
                    "gave",
                    "was given",
                    "were given"
                ],
                correct: 3,
                explanation: "Because 'rings' is plural, we use 'were', followed by the past participle of give ('given')."
            },
            {
                id: 5,
                type: "vocab",
                question: "What is 'MALICE'?",
                options: [
                    "The intention or desire to do evil.",
                    "A type of ancient elven magic.",
                    "The feeling of extreme sadness.",
                    "A shiny metal used to make rings."
                ],
                correct: 0,
                explanation: "Malice is pure ill-will or cruelty. Sauron poured his malice into the ring."
            },
            {
                id: 6,
                type: "grammar",
                question: "Change to Passive Voice: 'Sauron deceived them.' -> 'They ________ by Sauron.'",
                options: [
                    "deceived",
                    "were deceived",
                    "are deceived",
                    "was deceive"
                ],
                correct: 1,
                explanation: "'They' is plural, so we use 'were' + the past participle 'deceived'."
            },
            {
                id: 7,
                type: "context",
                question: "Why was the One Ring made?",
                options: [
                    "To be a gift for the Elf Kings.",
                    "To stop the war in Middle Earth.",
                    "To control all the other rings and dominate all life.",
                    "To make Sauron invisible."
                ],
                correct: 2,
                explanation: "Sauron forged it in secret to rule the others: 'One ring to rule them all'."
            },
            {
                id: 8,
                type: "grammar",
                question: "Identify the tense: 'A master ring was forged in secret.'",
                options: [
                    "Present Simple Passive",
                    "Past Continuous Active",
                    "Past Simple Passive",
                    "Past Perfect Passive"
                ],
                correct: 2,
                explanation: "It uses 'was' (past simple of to be) + 'forged' (past participle), making it Past Simple Passive."
            },
            {
                id: 9,
                type: "vocab",
                question: "In the phrase 'his will to dominate', the word 'WILL' is a noun meaning...",
                options: [
                    "The future auxiliary verb.",
                    "A legal document written before death.",
                    "Strong determination or desire.",
                    "A magical spell."
                ],
                correct: 2,
                explanation: "Here, 'will' (força de vontade) means his strong desire and determination to control everything."
            },
            {
                id: 10,
                type: "grammar",
                question: "Complete the active sentence correctly: 'The dark lord _________ in battle.'",
                options: [
                    "was defeated",
                    "defeated",
                    "was defeat",
                    "were defeated"
                ],
                correct: 0,
                explanation: "This is a trick! It's a PASSIVE sentence. The dark lord received the action of being defeated (was defeated)."
            },
            {
                id: 11,
                type: "expression",
                question: "Complete: 'One by one, the free lands ________ to the power of the ring.'",
                options: [
                    "felt",
                    "fell",
                    "failed",
                    "fall"
                ],
                correct: 1,
                explanation: "'Fell' is the past of 'fall'. They 'fell to the power', meaning they were conquered."
            },
            {
                id: 12,
                type: "vocab",
                question: "If the 'hearts of men are easily corrupted', what happens to them?",
                options: [
                    "They easily fall in love.",
                    "They become physically sick.",
                    "They are easily turned from good to evil.",
                    "They stop working."
                ],
                correct: 2,
                explanation: "To corrupt means to cause someone to act dishonestly or wickedly."
            },
            {
                id: 13,
                type: "grammar",
                question: "Which of the following is the correct structure for the Past Simple Passive?",
                options: [
                    "Am / Is / Are + Past Participle",
                    "Was / Were + Past Participle",
                    "Had been + Past Participle",
                    "Did + Base Verb"
                ],
                correct: 1,
                explanation: "For the past simple passive, we always use 'was' (singular) or 'were' (plural) plus the past participle (V3)."
            },
            {
                id: 14,
                type: "context",
                question: "Who took up his father's sword when all hope had faded?",
                options: [
                    "Elrond",
                    "Isildur",
                    "Galadriel",
                    "Sauron"
                ],
                correct: 1,
                explanation: "Isildur took the sword and used it to defeat Sauron."
            },
            {
                id: 15,
                type: "grammar",
                question: "Change to Active Voice: 'Nine rings were gifted to the race of men.' -> 'Someone _______ nine rings to the race of men.'",
                options: [
                    "gift",
                    "gifts",
                    "gifted",
                    "was gifting"
                ],
                correct: 2,
                explanation: "In active voice, the subject does the action directly in the past simple: 'Someone gifted'."
            }
        ];

        // --- MAIN APP COMPONENT ---
        function App() {
            const [step, setStep] = useState('start'); // 'start', 'quiz', 'result'
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [selectedOpt, setSelectedOpt] = useState(null);
            const [showExplanation, setShowExplanation] = useState(false);

            const startQuiz = () => {
                setStep('quiz');
                setCurrentQ(0);
                setScore(0);
            };

            const handleOptionClick = (index) => {
                if (selectedOpt !== null) return; 
                setSelectedOpt(index);
                setShowExplanation(true);

                if (index === QUESTIONS[currentQ].correct) {
                    setScore(s => s + 1);
                }
            };

            const handleNext = () => {
                if (currentQ < QUESTIONS.length - 1) {
                    setCurrentQ(q => q + 1);
                    setSelectedOpt(null);
                    setShowExplanation(false);
                } else {
                    setStep('result');
                }
            };

            const progress = ((currentQ) / QUESTIONS.length) * 100;

            // --- VIEWS ---

            if (step === 'start') {
                return (
                    <div className="flex flex-col items-center justify-center h-full p-6 text-center bg-[#0a0a0a] animate-pop relative">
                        <div className="absolute inset-0 bg-cover bg-center opacity-30 mix-blend-screen" style={{ backgroundImage: `url(${BG_COVER})` }}></div>
                        <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/60 to-[#0a0a0a]"></div>
                        
                        <div className="z-10 flex flex-col items-center">
                            <div className="w-16 h-16 bg-yellow-500 text-black font-epic font-black text-4xl flex items-center justify-center shadow-[0_0_30px_rgba(234,179,8,0.5)] mb-8 rounded-lg">W</div>
                            <h1 className="text-3xl font-black mb-2 uppercase tracking-tight text-white font-epic">B2 Master Quest</h1>
                            <h2 className="text-xl text-yellow-500 font-bold mb-8 uppercase tracking-widest">The Ring of Power</h2>
                            
                            <div className="bg-[#111]/90 backdrop-blur-sm border border-white/10 rounded-2xl p-6 mb-10 w-full max-w-sm shadow-xl">
                                <ul className="text-left text-gray-300 space-y-4 font-medium">
                                    <li className="flex items-center gap-3"><Icon name="scroll" className="text-emerald-500"/> 15 Advanced Challenges</li>
                                    <li className="flex items-center gap-3"><Icon name="eye" className="text-red-500"/> The Passive Voice Check</li>
                                    <li className="flex items-center gap-3"><Icon name="ring" className="text-yellow-500"/> Epic Vocabulary Review</li>
                                </ul>
                            </div>

                            <button 
                                onClick={startQuiz}
                                className="w-full max-w-sm bg-yellow-500 hover:bg-yellow-400 text-black font-black text-xl py-4 rounded-xl shadow-[0_0_20px_rgba(234,179,8,0.4)] transition-transform active:scale-95 uppercase tracking-widest font-epic"
                            >
                                Enter Middle Earth
                            </button>
                        </div>
                    </div>
                );
            }

            if (step === 'result') {
                const percentage = Math.round((score / QUESTIONS.length) * 100);
                let message = "";
                let iconName = "";
                let iconColor = "";

                if (percentage >= 90) { message = "ELVEN KING! 👑"; iconName = "crown"; iconColor = "text-yellow-400"; }
                else if (percentage >= 70) { message = "DÚNEDAIN RANGER! ⚔️"; iconName = "khanda"; iconColor = "text-gray-300"; }
                else if (percentage >= 50) { message = "HOBBIT SURVIVOR! 🍃"; iconName = "leaf"; iconColor = "text-emerald-400"; }
                else { message = "ORC CAPTIVE! 👹"; iconName = "skull"; iconColor = "text-red-500"; }

                return (
                    <div className="flex flex-col h-full bg-[#0a0a0a] animate-slideIn">
                        <div className="flex-1 overflow-y-auto p-6 flex flex-col items-center pb-12 custom-scrollbar">
                            
                            <Icon name={iconName} size={64} className={`${iconColor} mt-8 mb-4 drop-shadow-[0_0_30px_rgba(255,255,255,0.2)] animate-float`} />
                            <h1 className="text-4xl font-black mb-1 uppercase tracking-tight text-center font-epic text-white">{message}</h1>
                            <p className="text-gray-400 font-medium mb-8">Quest Complete</p>

                            <div className="bg-[#111] border border-yellow-500/30 rounded-3xl p-8 w-full max-w-sm text-center mb-8 shadow-2xl relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-yellow-500"></div>
                                <p className="text-sm text-yellow-500 font-bold uppercase tracking-widest mb-2 font-epic">Fellowship Score</p>
                                <div className="text-6xl font-black text-white mb-2 font-epic">{score} <span className="text-2xl text-gray-500 font-sans">/ {QUESTIONS.length}</span></div>
                                <p className="text-yellow-400 font-bold">{percentage}% Accuracy</p>
                            </div>

                            <div className="w-full max-w-sm mb-4">
                                <h3 className="text-xl font-bold mb-4 flex items-center gap-2 text-white font-epic"><Icon name="play-circle" className="text-yellow-500"/> Reward: The Prologue</h3>
                                <div className="w-full aspect-video bg-black rounded-xl overflow-hidden border border-white/10 shadow-lg">
                                    <iframe 
                                        className="w-full h-full" 
                                        src={`https://www.youtube.com/embed/${YOUTUBE_ID}?start=38&rel=0&modestbranding=1`} 
                                        frameBorder="0" 
                                        allowFullScreen>
                                    </iframe>
                                </div>
                            </div>
                            
                            <button 
                                onClick={() => setStep('start')}
                                className="w-full max-w-sm bg-[#222] hover:bg-[#333] text-white font-bold py-4 rounded-xl mt-4 transition-transform active:scale-95 uppercase tracking-wider font-epic"
                            >
                                Try Again
                            </button>
                        </div>
                    </div>
                );
            }

            // --- QUIZ VIEW ---
            const question = QUESTIONS[currentQ];

            return (
                <div className="flex flex-col h-full bg-[#0a0a0a] relative">
                    {/* Top Progress Bar */}
                    <div className="w-full h-2 bg-[#111]">
                        <div 
                            className="h-full bg-yellow-500 transition-all duration-500 shadow-[0_0_15px_rgba(234,179,8,0.8)]"
                            style={{ width: `${progress}%` }}
                        ></div>
                    </div>

                    {/* Header */}
                    <div className="flex justify-between items-center p-4 border-b border-white/5 bg-[#111]/50 backdrop-blur-md">
                        <div className="text-gray-400 font-bold text-sm tracking-widest">Q {currentQ + 1} OF {QUESTIONS.length}</div>
                        <div className="bg-[#222] border border-white/10 px-3 py-1 rounded-full flex items-center gap-2 shadow-inner">
                            <Icon name="star" size={12} className="text-yellow-500"/>
                            <span className="text-white font-bold text-sm">{score}</span>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div key={currentQ} className="flex-1 p-6 flex flex-col overflow-y-auto animate-slideIn pb-8 custom-scrollbar">
                        <span className="text-yellow-500 text-xs font-bold uppercase tracking-widest mb-3 flex items-center gap-1 bg-yellow-900/30 w-max px-3 py-1 rounded-full border border-yellow-500/30">
                            <Icon name={question.type === 'vocab' ? 'book' : question.type === 'grammar' ? 'crosshairs' : 'eye'} size={12} />
                            {question.type} Check
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-black leading-tight mb-8 text-white drop-shadow-md font-epic">
                            {question.question}
                        </h2>

                        <div className="flex flex-col gap-3 w-full mt-auto mb-8">
                            {question.options.map((opt, i) => {
                                const isSelected = selectedOpt === i;
                                const isCorrectAnswer = i === question.correct;
                                
                                let btnStyle = "bg-[#222] border-white/5 hover:border-yellow-500/50 hover:bg-[#333] text-gray-200 shadow-sm";
                                
                                if (showExplanation) {
                                    if (isCorrectAnswer) {
                                        btnStyle = "bg-green-900/40 border-green-500 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.2)]";
                                    } else if (isSelected && !isCorrectAnswer) {
                                        btnStyle = "bg-red-900/40 border-red-500 text-red-400 animate-shake";
                                    } else {
                                        btnStyle = "opacity-40 bg-[#111] border-transparent text-gray-500";
                                    }
                                }

                                return (
                                    <button 
                                        key={i}
                                        onClick={() => handleOptionClick(i)}
                                        className={`w-full text-left p-5 rounded-xl border-2 font-bold text-[15px] sm:text-lg transition-all duration-300 active:scale-[0.98] flex items-center justify-between ${btnStyle}`}
                                    >
                                        <span>{opt}</span>
                                        {showExplanation && isCorrectAnswer && <Icon name="check" size={18} />}
                                        {showExplanation && isSelected && !isCorrectAnswer && <Icon name="xmark" size={18} />}
                                    </button>
                                );
                            })}
                        </div>

                        {/* Explanation Box */}
                        <div className={`transition-all duration-500 overflow-hidden ${showExplanation ? 'max-h-48 opacity-100 mb-6' : 'max-h-0 opacity-0'}`}>
                            <div className="bg-[#111] border border-yellow-500/30 border-l-4 border-l-yellow-500 rounded-lg p-4 shadow-lg">
                                <p className="text-yellow-500 text-xs uppercase font-bold tracking-widest mb-1 font-epic">Elven Translation</p>
                                <p className="text-gray-200 text-sm font-medium leading-relaxed">{question.explanation}</p>
                            </div>
                        </div>

                        {/* Next Button */}
                        {showExplanation && (
                            <button 
                                onClick={handleNext}
                                className="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black text-lg py-4 rounded-xl mt-auto shadow-[0_0_20px_rgba(234,179,8,0.4)] active:scale-95 transition-transform uppercase tracking-wider animate-pop font-epic"
                            >
                                {currentQ === QUESTIONS.length - 1 ? 'Finish Quest' : 'Next Challenge'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // --- RENDER APP ---
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
